spring.application.name=auth-service

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (PostgreSQL)
# Replace the values below with your production/development Postgres credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/smartspend-auth
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=<PASSWORD>

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=<CLIENT-ID>
spring.security.oauth2.client.registration.google.client-secret=<CLIENT-SECRET>
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8080/swagger-ui/oauth2-redirect.html

# JWT Configuration
jwt.secret=<JWT-SECRET>
# Token expiration in milliseconds (default: 1 hour)
jwt.expiration=3600000

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.shubhamsahu=DEBUG
logging.level.org.springframework.security=DEBUG

